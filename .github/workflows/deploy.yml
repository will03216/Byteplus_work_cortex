name: Build, Push & Deploy

on:
  push:
    branches:
      - main
      - campaign
      - "release/**"

env:
  CR_REGISTRY: mittul-ap-southeast-3.cr.bytepluses.com
  CR_NAMESPACE: lead-engine
  CR_REPO: lead-engine

jobs:
  # ─── 1. Build & push image ────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to Byteplus CR
    runs-on: ubuntu-latest

    outputs:
      full_image: ${{ steps.meta.outputs.full_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive image tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          TAG="${SHORT_SHA}-$(date -u +%Y%m%d%H%M%S)"
          FULL="${{ env.CR_REGISTRY }}/${{ env.CR_NAMESPACE }}/${{ env.CR_REPO }}:${TAG}"
          echo "full_image=${FULL}" >> "$GITHUB_OUTPUT"

      - name: Log in to Byteplus CR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CR_REGISTRY }}
          username: ${{ secrets.CR_USERNAME }}
          password: ${{ secrets.CR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.full_image }}
            ${{ env.CR_REGISTRY }}/${{ env.CR_NAMESPACE }}/${{ env.CR_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 2. Deploy to ECS ─────────────────────────────────────────────────────
  deploy:
    name: Deploy to ECS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy via SSH
        env:
          FULL_IMAGE: ${{ needs.build-and-push.outputs.full_image }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}" << ENDSSH
          set -euo pipefail

          # Pull from Byteplus CR
          echo "${{ secrets.CR_PASSWORD }}" | \
            docker login ${{ env.CR_REGISTRY }} \
              -u "${{ secrets.CR_USERNAME }}" --password-stdin

          docker pull "${FULL_IMAGE}"

          # Stop and remove the existing container (ignore errors if not running)
          docker stop lead-engine 2>/dev/null || true
          docker rm   lead-engine 2>/dev/null || true

          mkdir -p /opt/lead-engine/output

          # Run the new container
          docker run -d \
            --name lead-engine \
            --restart unless-stopped \
            -p 8080:8080 \
            -v /opt/lead-engine/output:/app/output \
            -e LLM_PROVIDER=openai \
            -e LLM_API_BASE=https://ark.ap-southeast.bytepluses.com/api/v3 \
            -e LLM_MODEL=seed-2-0-pro-260328 \
            -e LLM_TIMEOUT_SECONDS=30 \
            -e APOLLO_ENABLED=false \
            -e APOLLO_TIMEOUT_SECONDS=10 \
            -e APP_USERNAME=admin \
            -e LLM_API_KEY="${{ secrets.LLM_API_KEY }}" \
            -e APOLLO_API_KEY="${{ secrets.APOLLO_API_KEY }}" \
            -e APP_PASSWORD="${{ secrets.APP_PASSWORD }}" \
            -e SESSION_SECRET="${{ secrets.SESSION_SECRET }}" \
            -e INSTANTLY_API_KEY="${{ secrets.INSTANTLY_API_KEY }}" \
            -e INSTANTLY_CAMPAIGN_ID="${{ secrets.INSTANTLY_CAMPAIGN_ID }}" \
            -e INSTANTLY_SCORE_THRESHOLD="${{ secrets.INSTANTLY_SCORE_THRESHOLD }}" \
            -e PLACEHOLDER_EMAIL="${{ secrets.PLACEHOLDER_EMAIL }}" \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            "${FULL_IMAGE}"

          # Verify
          docker ps --filter name=lead-engine --format "table {{.ID}}\t{{.Status}}\t{{.Ports}}"

          # Prune dangling images to reclaim disk space
          docker image prune -f
          ENDSSH

      - name: Health check
        run: |
          sleep 20
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}" \
            "curl -sf http://localhost:8080/health && echo 'Health check passed'"
