apiVersion: apps/v1
kind: Deployment
metadata:
  name: lead-engine
  namespace: lead-engine
  labels:
    app: lead-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lead-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0      # zero-downtime deploys
  template:
    metadata:
      labels:
        app: lead-engine
    spec:
      # Pull secret for Byteplus Container Registry
      imagePullSecrets:
        - name: byteplus-cr-secret

      terminationGracePeriodSeconds: 30

      containers:
        - name: lead-engine
          # CI/CD replaces :latest with the exact SHA tag on every deploy
          image: mittul-ap-southeast-3.cr.bytepluses.com/lead-engine/lead-engine:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http

          # Non-sensitive config from ConfigMap
          envFrom:
            - configMapRef:
                name: lead-engine-config
            - secretRef:
                name: lead-engine-secrets

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          # Persist run artifacts across pod restarts.
          # Use a PVC in production; emptyDir is fine for ephemeral testing.
          volumeMounts:
            - name: output
              mountPath: /app/output

      volumes:
        - name: output
          persistentVolumeClaim:
            claimName: lead-engine-output-pvc
