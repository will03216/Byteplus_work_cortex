apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lead-engine
  namespace: lead-engine
  annotations:
    # Existing ALB instance ID from BytePlus Console → ALB
    ingress.vke.volcengine.com/alb-id: "alb-3myssdbs0o7b47xmbl5slqn7l"

    # Health check
    ingress.vke.volcengine.com/healthcheck-path: "/health"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lead-engine
                port:
                  number: 80
