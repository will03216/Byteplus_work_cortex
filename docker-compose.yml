services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/seedance
      LLM_API_KEY:  ${LLM_API_KEY}
      LLM_MODEL:    ${LLM_MODEL:-anthropic/claude-haiku-4-5-20251001}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_SSL_VERIFY: ${LLM_SSL_VERIFY:-true}
      APOLLO_ENABLED: ${APOLLO_ENABLED:-false}
      APOLLO_API_KEY: ${APOLLO_API_KEY:-}
      APOLLO_TIMEOUT_SECONDS: ${APOLLO_TIMEOUT_SECONDS:-10}
      INSTANTLY_API_KEY: ${INSTANTLY_API_KEY:-}
      INSTANTLY_CAMPAIGN_ID: ${INSTANTLY_CAMPAIGN_ID:-}
      INSTANTLY_SCORE_THRESHOLD: ${INSTANTLY_SCORE_THRESHOLD:-75}
      PLACEHOLDER_EMAIL: ${PLACEHOLDER_EMAIL:-}
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-admin}
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-secret}
    volumes:
      # Temp run files survive app restarts; DB is the source of truth
      - run_data:/app/output/runs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       seedance
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"   # expose for local psql / DBeaver access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seedance"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pg_data:
  run_data:
